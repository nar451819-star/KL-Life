<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KL">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>KL · Keep Life</title>
</head>
<body>
<div class="app">
<header class="topbar">
  <button class="brand" data-action="home">
    <span class="logo">KL</span>
    <span><strong>Keep Life</strong><small>把今天，留给未来的自己。</small></span>
  </button>
  <button class="icon-btn" data-action="settings">•••</button>
</header>
<main>
  <section id="home-view" class="view active"></section>
  <section id="work-view" class="view"></section>
  <section id="finance-view" class="view"></section>
  <section id="study-view" class="view"></section>
  <section id="life-view" class="view"></section>
  <section id="day-view" class="view"></section>
  <section id="settings-view" class="view"></section>
</main>
</div>

<div id="overlay" class="overlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn compact" data-action="close-modal">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<input id="import-file" type="file" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
